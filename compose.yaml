services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-river}
      POSTGRES_USER: ${POSTGRES_USER:-river}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 中配置独立的数据库密码}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: river:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER:-river}:${POSTGRES_PASSWORD:?请配置数据库密码}@db:5432/${POSTGRES_DB:-river}?sslmode=disable}"
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      STATIC_DIR: /app/web/dist
      JOIN_PASSWORD: ${JOIN_PASSWORD:-}
      GUEST_ENABLED: ${GUEST_ENABLED:-true}
      VOICE_ENABLED: ${VOICE_ENABLED:-true}
      DEFAULT_VOICE_MODE: ${DEFAULT_VOICE_MODE:-free}
      SPECTATOR_VOICE_ENABLED: ${SPECTATOR_VOICE_ENABLED:-false}
      CHAT_ENABLED: ${CHAT_ENABLED:-true}
      REACTIONS_ENABLED: ${REACTIONS_ENABLED:-true}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ICE_SERVERS_JSON: ${ICE_SERVERS_JSON:-[]}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN:-localhost}", "--to", "app:8080"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
